<div class="layout-wrapper">
  
  <app-sidebar class="sidebar-container" [class.mobile-open]="isMobileMenuOpen"></app-sidebar>

  <div class="main-area">

    <app-header class="header-container" 
              [menuAberto]="isMobileMenuOpen" 
              (menuToggle)="toggleMenu()">
  </app-header>
  
    <main class="content-container">
      <router-outlet></router-outlet>
    </main> 
  </div>
  @if (isMobileMenuOpen) {
    <div class="overlay" (click)="toggleMenu()"></div>
  }
  
</div>
