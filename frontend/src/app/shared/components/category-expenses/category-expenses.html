<div class="category-card">
  <!-- Cabeçalho do Cartão -->
  <h3 class="card-title">{{ titulo }}</h3>

  <div class="total-section">
    <span class="total-label">Total de gastos</span>
    <h2 class="total-value">R$ {{ formatarValor(total) }}</h2>
  </div>

  <div class="categories-list">
    @if (listaItens.length === 0 || total === 0) {
      <div class="empty-state">
        <span class="empty-text">{{ mensagemVazio }}</span>
      </div>
    } @else {
      @for (item of listaItens; track item.nome) {
        <div class="category-row">
          <span class="cat-name" [title]="item.nome">{{ item.nome }}</span>
          <div class="bar-track">
            <div class="bar-fill" 
                 [style.width.%]="calcularPercentagem(item.valor)" 
                 [style.background-color]="item.cor">
            </div>
          </div>
          <span class="cat-value" [style.color]="item.cor">R$ {{ formatarValor(item.valor) }}</span>
        </div>
      }
    }
  </div>
</div>
