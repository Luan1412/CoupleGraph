<div class="container-boasVindas">
  
  <div class="lado-esquerdo">
    <div class="brand-area">
      <img src="/images/logo.svg" alt="Ilustração CoupleGraph" class="hero-image">
      <h1 class="texto-logo"><span class="azul-marinho">COUPLE</span><span class="verde">GRAPH</span></h1>
    </div>
    
    <div class="area-slogan">
      <h2>SUAS FINANÇAS<br>COM SEU PAR</h2>
      <p>Organize, acompanhe e planeje juntos.</p>
    </div>
  </div>

  
  <div class="lado-direito">
    <div class="texto-boasVindas">
      <h2>Bem-vindo ao<br>CoupleGraph</h2>
      <p>Acompanhe suas finanças em conjunto.</p>
    </div>

    <!-- Card do grafico  mockado-->
    <div class="mock-card">
      <img src="/images/COUPLEGRAPH.svg" alt="Logo CoupleGraph" class="logo-card">
      <h3>Gastos do mês</h3>
      <p class="valor-total">R$ 2.400</p>
      
      <div class="lista-progresso">
        <div class="progresso-item">
          <span class="label">Casa</span>
          <div class="bar-bg"><div class="bar-fill bg-verde" style="width: 100%"></div></div>
          <span class="value val-verde">1200</span>
        </div>
        <div class="progresso-item">
          <span class="label">Alimentação</span>
          <div class="bar-bg"><div class="bar-fill bg-azul" style="width: 70%"></div></div>
          <span class="value val-azul">650</span>
        </div>
        <div class="progresso-item">
          <span class="label">Lazer</span>
          <div class="bar-bg"><div class="bar-fill bg-roxo" style="width: 50%"></div></div>
          <span class="value val-roxo">300</span>
        </div>
        <div class="progresso-item">
          <span class="label">Transporte</span>
          <div class="bar-bg"><div class="bar-fill bg-laranja" style="width: 25%"></div></div>
          <span class="value val-laranja">250</span>
        </div>
      </div>
    </div>


    <div class="botoes-acoes">
      <button (click)="irParaCadastro()" class="btn-outline">Cadastrar</button>
      <button (click)="irParaLogin()" class="btn-solid">Entrar</button>
    </div>
  </div>
</div>
