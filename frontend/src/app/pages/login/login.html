<div class="container-auth">
  <div class="lado-esquerdo">
    <div class="brand-area">
      <img src="/images/logo.svg" alt="Ilustração CoupleGraph" class="hero-image">
      <h1 class="texto-logo"><span class="azul-marinho">COUPLE</span><span class="verde">GRAPH</span></h1>
    </div>
    <div class="area-slogan">
      <h2>SUAS FINANÇAS<br>COM SEU PAR</h2>
      <p>Organize, acompanhe e planeje juntos.</p>
    </div>
  </div>

  <div class="lado-direito">
    <div class="texto-header">
      <h2>Bem-vindo ao<br>CoupleGraph</h2>
      <p>Organize suas finanças<br>juntos, de forma simples.</p>
    </div>

    <div class="auth-card">
      <img src="/images/COUPLEGRAPH.svg" alt="Logo CoupleGraph" class="logo-card">
      
      <form>
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="Digite seu e-mail">
        </div>
        
        <div class="input-group">
          <label>Senha</label>
          <div class="input-wrapper">
            <input [type]="hidePassword() ? 'password' : 'text'" placeholder="**********">
            
            <button type="button" class="btn-icon" (click)="togglePassword()">
              @if (hidePassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              }
            </button>
          </div>
        </div>

        <button type="button" class="btn-solid">Entrar</button>
      </form>
    </div>

    <div class="footer-links">
      <p>Ainda não tem uma conta?</p>
      <a routerLink="/cadastro">Criar conta</a>
    </div>
  </div>
</div>
