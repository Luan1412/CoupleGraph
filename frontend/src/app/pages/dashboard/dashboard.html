<div class="dashboard-container">
  
  <h2 class="section-title">Resumo geral</h2>
  <div class="cards-grid">
    <app-summary-card 
      title="Saldo disponível" 
      value="R$ 3.250" 
      icon="/icons/ic-saldo.svg" 
      subtitle="Disponível atualmente" 
      [highlight]="true" 
      iconBgClass="bg-green-light">
    </app-summary-card>

    <app-summary-card 
      title="Receitas" 
      value="R$ 5.000" 
      icon="/icons/ic-receitas.svg" 
      [highlight]="true"
      iconBgClass="bg-green-light">
    </app-summary-card>

    <app-summary-card 
      title="Despesas" 
      value="R$ 1.750" 
      icon="/icons/ic-despesas.svg" 
      [highlight]="true"
      iconBgClass="bg-red-light">
    </app-summary-card>
  </div>

  <div class="bottom-grid">
    
    <app-category-expenses
      [total]="totalGastos"
      [categorias]="gastosCategorias">
    </app-category-expenses>

    <app-spaces-widget
      [espacos]="meusEspacos">
    </app-spaces-widget>

  </div>

</div>
