<div class="dashboard-container">
  
  <h2 class="section-title">Resumo geral</h2>
  <div class="cards-grid">
    <app-summary-card 
      title="Saldo disponível" 
      [value]="themeService.formatarMoeda(saldoTotal())" 
      icon="/icons/ic-saldo.svg" 
      subtitle="Disponível atualmente" 
      [highlight]="true" 
      iconBgClass="bg-green-light">
    </app-summary-card>

    <app-summary-card 
      title="Receitas" 
      [value]="themeService.formatarMoeda(receitasTotais())" 
      icon="/icons/ic-receitas.svg" 
      [highlight]="true"
      iconBgClass="bg-green-light">
    </app-summary-card>

    <app-summary-card 
      title="Despesas" 
      [value]="themeService.formatarMoeda(despesasTotais())" 
      icon="/icons/ic-despesas.svg" 
      [highlight]="true"
      iconBgClass="bg-red-light">
    </app-summary-card>
  </div>

  <div class="bottom-grid">
    
    <app-category-expenses
      titulo="Gastos por espaço"
      [total]="totalGastosEspacos()"
      [itens]="gastosPorEspaco()"
      mensagemVazio="Sem gasto em espaços">
    </app-category-expenses>

    <app-spaces-widget
      [espacos]="meusEspacos()"
      [carregando]="carregandoEspacos()">
    </app-spaces-widget>

  </div>

</div>
